<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene Metrics Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f4f0;
      --text: #1a1a18;
      --text-secondary: #6b6a66;
      --border: rgba(0,0,0,0.14);
      --border-hover: rgba(0,0,0,0.26);
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg-secondary: #252523;
        --text: #e8e7e2;
        --text-secondary: #9a9994;
        --border: rgba(255,255,255,0.13);
        --border-hover: rgba(255,255,255,0.26);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
      font-size: 15px;
    }

    h1 { font-size: 17px; font-weight: 500; margin-bottom: 1.5rem; }
    #status { font-size: 13px; color: var(--text-secondary); margin-bottom: 1rem; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 1.25rem;
    }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; }
    .toolbar label { font-size: 13px; color: var(--text-secondary); }

    select {
      font-size: 13px;
      font-family: inherit;
      padding: 6px 10px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-hover);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }

    .metric-btn {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-hover);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      transition: background 0.12s;
    }
    .metric-btn:hover, .metric-btn.active { background: var(--bg-secondary); }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.25rem;
    }
    .stat-card { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 0.75rem 1rem; }
    .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    .stat-value { font-size: 20px; font-weight: 500; }

    .chart-wrap { position: relative; width: 100%; height: 340px; cursor: pointer; }
    #footer { font-size: 12px; color: var(--text-secondary); margin-top: 0.75rem; }

    /* Hover tooltip */
    #tooltip {
      display: none;
      position: fixed;
      z-index: 999;
      background: var(--bg);
      border: 0.5px solid var(--border-hover);
      border-radius: var(--radius-lg);
      padding: 10px;
      pointer-events: none;
      max-width: 240px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.13);
    }
    #tt-label { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
    #tt-val { font-size: 11px; color: var(--text-secondary); white-space: pre; line-height: 1.7; margin-bottom: 8px; }
    #tt-img { width: 218px; height: 163px; object-fit: cover; border-radius: 6px; display: none; }
    #tt-loading, #tt-no-img { font-size: 11px; color: var(--text-secondary); display: none; }

    /* Modal overlay */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #modal-overlay.open { display: flex; }

    #modal {
      background: var(--bg);
      border-radius: var(--radius-lg);
      border: 0.5px solid var(--border-hover);
      width: min(720px, 94vw);
      max-height: 88vh;
      overflow-y: auto;
      padding: 1.5rem;
      position: relative;
    }

    #modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-secondary);
      line-height: 1;
      padding: 4px 8px;
      border-radius: var(--radius-md);
      transition: background 0.12s;
    }
    #modal-close:hover { background: var(--bg-secondary); }

    #modal-title { font-size: 16px; font-weight: 500; margin-bottom: 1.25rem; }

    /* Image carousel */
    .carousel {
      position: relative;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 1.25rem;
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
    .carousel img.active { display: block; }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.35);
      border: none;
      color: #fff;
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s;
      z-index: 2;
    }
    .carousel-btn:hover { background: rgba(0,0,0,0.6); }
    .carousel-btn.prev { left: 10px; }
    .carousel-btn.next { right: 10px; }
    .carousel-btn:disabled { opacity: 0.25; cursor: default; }

    .carousel-counter {
      position: absolute;
      bottom: 8px;
      right: 10px;
      font-size: 11px;
      color: rgba(255,255,255,0.85);
      background: rgba(0,0,0,0.35);
      padding: 2px 8px;
      border-radius: 20px;
    }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 1.25rem;
    }
    .carousel-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border-hover);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background 0.12s;
    }
    .carousel-dot.active { background: var(--text); }

    /* Metrics table */
    .metrics-section { margin-bottom: 1.25rem; }
    .metrics-section h2 { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
    }

    .metric-card {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 0.65rem 0.9rem;
    }
    .metric-card .m-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; }
    .metric-card .m-value { font-size: 16px; font-weight: 500; }

    /* Extra info section — placeholder for future content */
    .extra-section { border-top: 0.5px solid var(--border); padding-top: 1rem; }
    .extra-section h2 { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .extra-placeholder { font-size: 13px; color: var(--text-secondary); font-style: italic; }

    #modal-loading { font-size: 13px; color: var(--text-secondary); text-align: center; padding: 2rem 0; }

    @media (max-width: 560px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      body { padding: 1rem; }
    }
  </style>
</head>
<body>

<h1>Scene metrics viewer</h1>
<p id="status">Loading scenes...</p>

<div id="app" style="display:none;">
  <div class="toolbar">
    <div class="toolbar-left">
      <label>Sort by</label>
      <select id="sort-select" onchange="renderChart()">
        <option value="scene">Scene number</option>
        <option value="occlusion">Occlusion</option>
        <option value="proximity">Proximity</option>
      </select>
      <select id="order-select" onchange="renderChart()">
        <option value="asc">Ascending</option>
        <option value="desc">Descending</option>
      </select>
    </div>
    <div class="toolbar-right">
      <button class="metric-btn active" id="btn-occ" onclick="setMetric('occlusion')">Occlusion</button>
      <button class="metric-btn" id="btn-prox" onclick="setMetric('proximity')">Proximity</button>
    </div>
  </div>

  <div class="stats-row" id="stats-row"></div>

  <div class="chart-wrap">
    <canvas id="chart" role="img" aria-label="Bar chart of scene metrics"></canvas>
  </div>

  <p id="footer"></p>
</div>

<!-- Hover tooltip -->
<div id="tooltip">
  <p id="tt-label"></p>
  <p id="tt-val"></p>
  <img id="tt-img" alt="Scene viewpoint" />
  <p id="tt-loading">Loading image...</p>
  <p id="tt-no-img">No image available</p>
</div>

<!-- Detail modal -->
<div id="modal-overlay" onclick="handleOverlayClick(event)">
  <div id="modal">
    <button id="modal-close" onclick="closeModal()" aria-label="Close">✕</button>
    <p id="modal-title"></p>
    <p id="modal-loading">Loading...</p>

    <div id="modal-content" style="display:none;">
      <!-- Carousel -->
      <div class="carousel" id="carousel">
        <button class="carousel-btn prev" id="carousel-prev" onclick="carouselStep(-1)">&#8249;</button>
        <button class="carousel-btn next" id="carousel-next" onclick="carouselStep(1)">&#8250;</button>
        <span class="carousel-counter" id="carousel-counter"></span>
      </div>
      <div class="carousel-dots" id="carousel-dots"></div>

      <!-- Metrics -->
      <div class="metrics-section">
        <h2>Metrics</h2>
        <div class="metrics-grid" id="metrics-grid"></div>
      </div>

      <!-- Placeholder for future info -->
      <div class="extra-section">
        <h2>Additional info</h2>
        <p class="extra-placeholder">More details coming soon.</p>
      </div>
    </div>
  </div>
</div>

<script>
  let scenes = [];
  let activeMetric = 'occlusion';
  let chartInst = null;
  let hoverImageCache = {};
  let currentSorted = [];
  let carouselImages = [];
  let carouselIndex = 0;

  async function init() {
    try {
      const res = await fetch('/api/scenes');
      if (!res.ok) throw new Error('Server returned ' + res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      if (!data.length) throw new Error('No scenes found.');
      scenes = data;
      document.getElementById('status').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      renderChart();
    } catch (err) {
      document.getElementById('status').textContent = 'Error: ' + err.message;
    }
  }

  function setMetric(m) {
    activeMetric = m;
    document.getElementById('btn-occ').classList.toggle('active', m === 'occlusion');
    document.getElementById('btn-prox').classList.toggle('active', m === 'proximity');
    renderChart();
  }

  function getSorted() {
    const by = document.getElementById('sort-select').value;
    const order = document.getElementById('order-select').value;
    return [...scenes].sort((a, b) => {
      const va = by === 'scene' ? a.id : a[by];
      const vb = by === 'scene' ? b.id : b[by];
      return order === 'asc' ? va - vb : vb - va;
    });
  }

  function renderStats(data) {
    const vals = data.map(d => d[activeMetric]);
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    const mn = Math.min(...vals);
    const mx = Math.max(...vals);
    const label = activeMetric === 'occlusion' ? 'Occlusion' : 'Proximity';
    document.getElementById('stats-row').innerHTML =
      '<div class="stat-card"><p class="stat-label">' + label + ' \u2014 avg</p><p class="stat-value">' + avg.toFixed(2) + '</p></div>' +
      '<div class="stat-card"><p class="stat-label">' + label + ' \u2014 min</p><p class="stat-value">' + mn.toFixed(2) + '</p></div>' +
      '<div class="stat-card"><p class="stat-label">' + label + ' \u2014 max</p><p class="stat-value">' + mx.toFixed(2) + '</p></div>';
  }

  async function loadHoverImage(sceneId) {
    if (hoverImageCache[sceneId] !== undefined) return hoverImageCache[sceneId];
    try {
      const res = await fetch('/api/image/' + sceneId + '/viewpoint_1.png');
      if (!res.ok) { hoverImageCache[sceneId] = null; return null; }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      hoverImageCache[sceneId] = url;
      return url;
    } catch {
      hoverImageCache[sceneId] = null;
      return null;
    }
  }

  function showTooltip(scene, clientX, clientY) {
    document.getElementById('tt-label').textContent = 'Scene ' + scene.id;
    document.getElementById('tt-val').textContent =
      'Occlusion:  ' + scene.occlusion.toFixed(3) + '\nProximity:  ' + scene.proximity.toFixed(3);

    const img = document.getElementById('tt-img');
    const loading = document.getElementById('tt-loading');
    const noImg = document.getElementById('tt-no-img');
    img.style.display = 'none'; noImg.style.display = 'none';

    if (!scene.has_image) {
      loading.style.display = 'none'; noImg.style.display = 'block';
    } else if (hoverImageCache[scene.id]) {
      loading.style.display = 'none';
      img.src = hoverImageCache[scene.id]; img.style.display = 'block';
    } else {
      loading.style.display = 'block';
      loadHoverImage(scene.id).then(url => {
        if (document.getElementById('tt-label').textContent !== 'Scene ' + scene.id) return;
        loading.style.display = 'none';
        if (!url) { noImg.style.display = 'block'; return; }
        img.src = url; img.style.display = 'block';
      });
    }

    const tt = document.getElementById('tooltip');
    tt.style.display = 'block';
    const w = 250;
    tt.style.left = (clientX + 14 + w > window.innerWidth ? clientX - w - 14 : clientX + 14) + 'px';
    tt.style.top = Math.max(8, clientY - 90) + 'px';
  }

  // --- Modal ---
  async function openModal(scene) {
    document.getElementById('tooltip').style.display = 'none';
    document.getElementById('modal-title').textContent = 'Scene ' + scene.id;
    document.getElementById('modal-loading').style.display = 'block';
    document.getElementById('modal-content').style.display = 'none';
    document.getElementById('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';

    try {
      const res = await fetch('/api/scene/' + scene.id);
      const detail = await res.json();
      populateModal(detail);
    } catch (e) {
      document.getElementById('modal-loading').textContent = 'Failed to load scene details.';
    }
  }

  function populateModal(detail) {
    document.getElementById('modal-loading').style.display = 'none';
    document.getElementById('modal-content').style.display = 'block';

    // Build carousel
    carouselImages = detail.viewpoints || [];
    carouselIndex = 0;
    const carousel = document.getElementById('carousel');

    // Remove old images
    carousel.querySelectorAll('img').forEach(el => el.remove());

    carouselImages.forEach((src, i) => {
      const img = document.createElement('img');
      img.alt = 'Viewpoint ' + (i + 1);
      img.src = src;
      if (i === 0) img.classList.add('active');
      carousel.appendChild(img);
    });

    // Dots
    const dots = document.getElementById('carousel-dots');
    dots.innerHTML = '';
    if (carouselImages.length > 1) {
      carouselImages.forEach((_, i) => {
        const dot = document.createElement('button');
        dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
        dot.setAttribute('aria-label', 'Viewpoint ' + (i + 1));
        dot.onclick = () => goToSlide(i);
        dots.appendChild(dot);
      });
    }

    updateCarouselUI();

    // Metrics
    const grid = document.getElementById('metrics-grid');
    grid.innerHTML = '';
    const metrics = detail.metrics || {};
    Object.entries(metrics).forEach(([key, val]) => {
      const card = document.createElement('div');
      card.className = 'metric-card';
      const label = key.replace(/_/g, ' ');
      const display = typeof val === 'number' ? val.toFixed(4) : val;
      card.innerHTML = '<p class="m-label">' + label + '</p><p class="m-value">' + display + '</p>';
      grid.appendChild(card);
    });
  }

  function updateCarouselUI() {
    const imgs = document.getElementById('carousel').querySelectorAll('img');
    imgs.forEach((img, i) => img.classList.toggle('active', i === carouselIndex));

    const dots = document.getElementById('carousel-dots').querySelectorAll('.carousel-dot');
    dots.forEach((d, i) => d.classList.toggle('active', i === carouselIndex));

    document.getElementById('carousel-counter').textContent =
      carouselImages.length > 0 ? (carouselIndex + 1) + ' / ' + carouselImages.length : '';

    document.getElementById('carousel-prev').disabled = carouselIndex === 0;
    document.getElementById('carousel-next').disabled = carouselIndex === carouselImages.length - 1;
  }

  function carouselStep(dir) {
    const next = carouselIndex + dir;
    if (next >= 0 && next < carouselImages.length) {
      carouselIndex = next;
      updateCarouselUI();
    }
  }

  function goToSlide(i) {
    carouselIndex = i;
    updateCarouselUI();
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  }

  document.addEventListener('keydown', e => {
    if (!document.getElementById('modal-overlay').classList.contains('open')) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft') carouselStep(-1);
    if (e.key === 'ArrowRight') carouselStep(1);
  });

  // --- Chart ---
  function renderChart() {
    const sorted = getSorted();
    currentSorted = sorted;
    renderStats(sorted);

    const labels = sorted.map(s => 'Scene ' + s.id);
    const vals = sorted.map(s => s[activeMetric]);
    const color = activeMetric === 'occlusion' ? '#378ADD' : '#1D9E75';

    if (chartInst) chartInst.destroy();

    const ctx = document.getElementById('chart').getContext('2d');
    chartInst = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{ data: vals, backgroundColor: color + 'CC', borderColor: color, borderWidth: 1, borderRadius: 4 }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: {
          x: { ticks: { font: { size: 11 }, maxRotation: 45, autoSkip: sorted.length > 40 }, grid: { display: false } },
          y: { ticks: { font: { size: 11 } }, grid: { color: 'rgba(128,128,128,0.14)' } }
        },
        onHover: (evt, elements) => {
          const tt = document.getElementById('tooltip');
          if (!elements.length) { tt.style.display = 'none'; return; }
          showTooltip(currentSorted[elements[0].index], evt.native.clientX, evt.native.clientY);
        },
        onClick: (evt, elements) => {
          if (!elements.length) return;
          const scene = currentSorted[elements[0].index];
          openModal(scene);
        }
      }
    });

    document.getElementById('chart').addEventListener('mouseleave', () => {
      document.getElementById('tooltip').style.display = 'none';
    });

    document.getElementById('footer').textContent =
      scenes.length + ' scene' + (scenes.length !== 1 ? 's' : '') + ' \u00b7 hover to preview \u00b7 click for details';
  }

  init();
</script>
</body>
</html>
